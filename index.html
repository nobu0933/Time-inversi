<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#608000">
  <title>Time Inversi</title>
  <link rel="stylesheet" href="styles/style.css">
  <script defer src="src/game/rules.js"></script>
  <script defer src="src/ui/game.js"></script>
</head>
<body>
  <main class="stage" aria-label="Time Inversi：6×6のリバーシ">
    <div class="board"><div id="cells" class="cells" role="group" aria-label="リバーシ盤"></div></div>
    <div class="time-controls">
      <span id="time-direction">順行 →</span>
      <button id="inversion" type="button" aria-describedby="time-direction">TIME INVERSION</button>
    </div>
    <p id="announcement" class="sr-only" role="status" aria-live="polite"></p>
    <div id="notice" class="notice" hidden></div>
    <div id="result" class="result" hidden>
      <p id="result-text"></p>
      <button id="restart" type="button">もう一度</button>
    </div>
  </main>
</body>
</html>
